<!DOCTYPE html>
<html>
<head>
    <title>Docker Postgres Test</title>
</head>

<body>

    <h1>Postgres Button Test</h1>

    <button id="logButton">
        Log click
    </button>

    <p id="result"></p>

    <script>
        const button = document.getElementById("logButton");
        const result = document.getElementById("result");

        button.addEventListener("click", async () => {
            const response = await fetch("/api/click", {
                method: "POST"
            });

            const data = await response.json();

            result.textContent =
                `Saved click #${data.id} at ${data.clicked_at}`;
        });
    </script>

</body>
</html>
